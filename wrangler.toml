name = "flagman"
main = "worker/index.ts"
compatibility_date = "2026-10-01"

[assets]
not_found_handling = "single-page-application"
# Navigations to /api/* (OAuth redirects) must reach the Worker, not the SPA fallback.
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "flagman"
# Replace with the id from `wrangler d1 create flagman` before deploying.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "RACE"
class_name = "RaceDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RaceDO"]
